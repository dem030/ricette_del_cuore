; Hardening di PHP

; Non rivelare la versione di PHP (header X-Powered-By)
expose_php = Off

; Gli errori vanno nel log del container, mai nella pagina
display_errors = Off
display_startup_errors = Off
log_errors = On

; Niente inclusione di file remoti
allow_url_include = Off

; Sessioni: cookie non accessibile da JS, niente ID nell'URL, solo ID generati dal server
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.use_only_cookies = 1
session.use_strict_mode = 1
