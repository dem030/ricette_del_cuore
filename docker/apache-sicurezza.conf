# Hardening di Apache

# Non rivelare versione del server e sistema operativo (header "Server" e pagine di errore)
ServerTokens Prod
ServerSignature Off

# Disabilita il metodo HTTP TRACE (Cross-Site Tracing)
TraceEnable Off

# Niente elenco dei file nelle cartelle senza index (es. /images/)
<Directory /var/www/html>
    Options -Indexes
</Directory>

# Header di sicurezza HTTP
# - nosniff: il browser non "indovina" il tipo dei file
Header always set X-Content-Type-Options "nosniff"
# - DENY: il sito non può essere caricato in un iframe (clickjacking)
Header always set X-Frame-Options "DENY"
# - non inviare l'URL completo ad altri siti
Header always set Referrer-Policy "strict-origin-when-cross-origin"
# - nega l'accesso a API sensibili del browser
Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"
# - Content Security Policy: script e stili solo dal sito stesso, immagini anche da URL esterni
#   ('unsafe-inline' serve perché alcune pagine hanno script e stili inline)
Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: http:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
