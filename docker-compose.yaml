# Le credenziali vengono lette dal file .env (escluso da git).
# Primo avvio: copia .env.example in .env e scegli delle password.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recipe_app
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-ricette}
      DB_USER: ${DB_USER:?Copia .env.example in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Copia .env.example in .env}
    volumes:
      - ./app:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: recipe_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copia .env.example in .env}
      MYSQL_DATABASE: ${DB_NAME:-ricette}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    # Nessuna porta pubblicata: il database è raggiungibile solo dagli altri container
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./ricette.sql:/docker-entrypoint-initdb.d/02-ricette.sql
      - ./mysql/03-utente-app.sh:/docker-entrypoint-initdb.d/03-utente-app.sh

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: phpmyadmin
    restart: always
    # Raggiungibile solo dal computer locale, non dalla rete
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data:
